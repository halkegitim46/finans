name: Android derleme ortamı
description: JDK 17, Gradle, SDK lisansları ve Gradle wrapper hazırlığı (tüm işlerde ortak; tek yerde güncellenir)

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - uses: gradle/actions/setup-gradle@v5
      with:
        gradle-version: '8.9'

    - name: Betikleri hazırla (CRLF → LF, çalıştırma izni)
      shell: bash
      run: |
        # Windows'ta düzenlenen dosyalardaki satır sonu (CRLF) bash betiklerini bozar; her çalıştırmada normalize edilir.
        sed -i 's/\r$//' .github/scripts/*.sh
        chmod +x .github/scripts/*.sh

    - name: SDK lisansları ve Gradle wrapper
      shell: bash
      run: |
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
        if [ ! -f gradlew ]; then
          gradle wrapper --gradle-version 8.9
        fi
        chmod +x gradlew
        ./gradlew --version
