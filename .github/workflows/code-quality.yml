name: Kod kalitesi (elle)

# Elle çalıştırılır; derlemeyi ve APK üretimini ETKİLEMEZ.
# Android Lint ve detekt (varsayılan kurallar) raporlarını üretir.
on:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-android-build

      - name: "🔬 Android Lint"
        continue-on-error: true
        shell: bash
        run: |
          set +e
          ./gradlew lintDebug --no-daemon --console=plain 2>&1 | tee lint.log
          {
            echo "### 🔬 Android Lint"
            if [ -f app/build/reports/lint-results-debug.txt ]; then
              echo ""
              echo '```'
              tail -n 20 app/build/reports/lint-results-debug.txt
              echo '```'
            else
              echo ""
              echo "Lint raporu üretilemedi (günlüğe bakın)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: "🔬 detekt (bilgi amaçlı)"
        continue-on-error: true
        shell: bash
        run: |
          SRC_DIRS=""
          for d in app/src/main/java app/src/main/kotlin; do
            [ -d "$d" ] && SRC_DIRS="$SRC_DIRS --input $d"
          done
          if [ -z "$SRC_DIRS" ]; then
            echo "::warning::app/src/main/java veya app/src/main/kotlin bulunamadı, detekt atlandı."
            exit 0
          fi
          curl -sSL -o detekt-cli.jar https://github.com/detekt/detekt/releases/download/v1.23.7/detekt-cli-1.23.7-all.jar
          java -jar detekt-cli.jar $SRC_DIRS --report html:detekt-raporu.html --report txt:detekt-raporu.txt || true
          head -60 detekt-raporu.txt 2>/dev/null || true

      - name: "📤 Raporları yükle"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kod-kalitesi-raporlari
          path: |
            app/build/reports/
            detekt-raporu.html
            detekt-raporu.txt
            lint.log
          retention-days: 14
          if-no-files-found: ignore