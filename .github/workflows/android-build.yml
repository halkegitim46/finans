name: Android CI + Release

# Tek iş akışı: preflight → version → (build | quality | release) → summary
#  • build   : birim testleri + debug APK. Testler kırık olsa bile APK üretilir; iş en sonda yine KIRMIZI biter.
#  • release : imzalı, R8'li APK. build işine BAĞLI DEĞİL (paralel); push ve tag'de otomatik, elle çalıştırmada isteğe bağlı.
#  • quality : Android Lint (bilgi amaçlı; sonucu iş akışını bozmaz).
# İmza secret'ları: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD (eski KFT_ önekli adlar da okunur).
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Release APK da üretilsin mi? (KAPATMAK için işareti kaldırın)"
        type: boolean
        default: true
      minify:
        description: "R8 küçültme (release açılışta çöküyorsa false deneyin)"
        type: choice
        default: "true"
        options:
          - "true"
          - "false"
      version_name:
        description: "Sürüm adı (boşsa 1.0.<yılaygünsaatdakika>)"
        type: string
        required: false
        default: ""

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ============================================================
  # 0) PREFLIGHT: derlemeden önce ortamı denetler (değer göstermez)
  # ============================================================
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      has_keystore: ${{ steps.secrets.outputs.has_keystore }}
    steps:
      - uses: actions/checkout@v5

      - name: "🔎 Secret varlığı (yalnızca VAR/YOK)"
        id: secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.KFT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.KFT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.KFT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KFT_KEY_PASSWORD }}
        run: |
          has_ks=true
          {
            echo "## 🧪 Preflight"
            echo ""
            echo "| Secret | Durum |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -n "${!name:-}" ]; then
              echo "| $name | ✅ VAR |" >> "$GITHUB_STEP_SUMMARY"
              echo "[VAR] $name"
            else
              echo "| $name | ❌ YOK |" >> "$GITHUB_STEP_SUMMARY"
              echo "[YOK] $name"
              has_ks=false
            fi
          done
          echo "has_keystore=$has_ks" >> "$GITHUB_OUTPUT"
          if [ "$has_ks" = false ]; then
            echo "::warning::İmza secret'ları eksik: release APK üretilemez (debug APK etkilenmez)."
          fi

      - name: "🔎 Proje dosyaları ve sürüm satırları"
        shell: bash
        run: |
          missing=0
          for f in app/build.gradle.kts app/proguard-rules.pro gradle/libs.versions.toml settings.gradle.kts; do
            if [ -f "$f" ]; then echo "[VAR] $f"; else echo "::error::[YOK] $f"; missing=1; fi
          done
          [ -f gradlew ] && echo "[VAR] gradlew" || echo "[YOK] gradlew — iş akışı üretecek (sorun değil)"
          grep -qE '^\s*versionCode\s*=\s*[0-9]+' app/build.gradle.kts || { echo "::error::versionCode satırı 'versionCode = <sayı>' biçiminde değil"; missing=1; }
          grep -qE '^\s*versionName\s*=\s*".*"' app/build.gradle.kts || { echo "::error::versionName satırı 'versionName = \"...\"' biçiminde değil"; missing=1; }
          grep -q 'KEYSTORE_PATH' app/build.gradle.kts || { echo "::warning::KEYSTORE_PATH build.gradle.kts içinde okunmuyor: release imzasız kalabilir"; }
          grep -q 'taskGraph.whenReady' app/build.gradle.kts && echo "[VAR] release imza koruması (taskGraph.whenReady)" || echo "::warning::release imza koruması yok"
          exit $missing

  # ============================================================
  # 1) VERSION: ortak, hep artan sürüm kodu
  # ============================================================
  version:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      version_name: ${{ steps.ver.outputs.name }}
      version_code: ${{ steps.ver.outputs.code }}
    steps:
      - id: ver
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version_name }}
        run: |
          stamp="$(date -u +%y%m%d%H%M)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"
          elif [[ -n "${INPUT_VERSION:-}" ]]; then
            name="$INPUT_VERSION"
          else
            name="1.0.$stamp"
          fi
          name="$(printf '%s' "$name" | tr -c 'A-Za-z0-9._-' '_')"
          code="$(( $(date -u +%s) / 60 ))"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "### 🏷️ Sürüm: \`$name\` (versionCode \`$code\`)" >> "$GITHUB_STEP_SUMMARY"

  # ============================================================
  # 2) BUILD: birim testleri + debug APK (release'i engellemez)
  # ============================================================
  build:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION_NAME: ${{ needs.version.outputs.version_name }}
      VERSION_CODE: ${{ needs.version.outputs.version_code }}
    steps:
      - uses: actions/checkout@v5

      - name: "🔒 Gradle wrapper doğrula (depoda varsa)"
        if: ${{ hashFiles('gradle/wrapper/gradle-wrapper.jar') != '' }}
        uses: gradle/actions/wrapper-validation@v5

      - uses: ./.github/actions/setup-android-build

      - name: "🔐 İmza anahtarını hazırla (varsa)"
        id: signing
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.KFT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.KFT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.KFT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KFT_KEY_PASSWORD }}
          SIGNING_STRICT: "false"
        run: .github/scripts/prepare-signing.sh

      - name: "🏷️ Sürüm numaralarını güncelle"
        shell: bash
        run: .github/scripts/apply-version.sh

      - name: "🧪 Birim testleri"
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -o pipefail
          rc=0
          ./gradlew testDebugUnitTest --no-daemon --stacktrace --console=plain 2>&1 | tee unit-tests.log || rc=$?
          python3 .github/scripts/summarize-tests.py >> "$GITHUB_STEP_SUMMARY" || true
          exit "$rc"

      - name: "📦 Debug APK derle"
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.KFT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.KFT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KFT_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee debug-build.log

      - name: "📦 Debug APK'yı adlandır"
        shell: bash
        run: |
          mkdir -p out
          src="$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1 || true)"
          if [ -z "$src" ]; then
            echo "::error::Debug APK üretilmedi (app/build/outputs/apk/debug/ boş)."
            ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "(klasör yok)"
            exit 1
          fi
          cp "$src" "out/FinansTakip_V${VERSION_NAME}-debug.apk"
          ls -lh out/

      - name: "🔐 Debug APK imzası (bilgi)"
        continue-on-error: true
        shell: bash
        run: |
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --verbose --print-certs out/*.apk 2>&1 | grep -E "^Verifies|certificate (DN|SHA-256)" || true

      - name: "📤 Debug APK'yı yükle"
        uses: actions/upload-artifact@v6
        with:
          name: FinansTakip-v${{ needs.version.outputs.version_name }}-debug-apk
          path: out/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: "🩺 Derleme hata özeti"
        if: failure()
        shell: bash
        run: |
          {
            echo "## ❌ Build hatası"
            echo '```'
            grep -nE "^e: |error:|FAILURE:|What went wrong|Caused by|Could not|Unresolved|Execution failed|> Task .* FAILED" \
              unit-tests.log debug-build.log 2>/dev/null | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "📤 Günlükler ve test raporu"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-diagnostics
          path: |
            unit-tests.log
            debug-build.log
            app/build/reports/tests/
          retention-days: 14
          if-no-files-found: ignore

      - name: "🚦 Test sonucunu uygula"
        if: ${{ always() && steps.tests.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::error::Birim testleri başarısız: ayrıntı iş özetinde ve 'build-diagnostics' artifact'ında. Debug APK yine de üretildi."
          exit 1

  # ============================================================
  # 3) QUALITY: Android Lint (bilgi amaçlı, iş akışını bozmaz)
  #    continue-on-error ADIM seviyesinde (job seviyesinde değil)
  # ============================================================
  quality:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-android-build

      - name: "🔬 Android Lint"
        continue-on-error: true
        shell: bash
        run: |
          set +e
          ./gradlew lintDebug --no-daemon --console=plain 2>&1 | tee lint.log
          report="app/build/reports/lint-results-debug.txt"
          {
            echo "### 🔬 Android Lint"
            if [ -f "$report" ]; then
              echo ""
              echo '```'
              tail -n 3 "$report"
              echo '```'
            else
              echo ""
              echo "Lint raporu üretilemedi (günlüğe bakın)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: "📤 Lint raporu"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lint-raporu
          path: |
            app/build/reports/
            lint.log
          retention-days: 14
          if-no-files-found: ignore

  # ============================================================
  # 4) RELEASE: imzalı APK (build'e bağlı değil; paralel)
  # ============================================================
  release:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.release != 'false')
    needs: [preflight, version]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      VERSION_NAME: ${{ needs.version.outputs.version_name }}
      VERSION_CODE: ${{ needs.version.outputs.version_code }}
    steps:
      - uses: actions/checkout@v5

      - name: "🔎 Teşhis: bu iş neden çalıştı?"
        shell: bash
        run: |
          echo "event      : ${{ github.event_name }}"
          echo "ref        : ${{ github.ref }}"
          echo "release    : ${{ github.event.inputs.release }}"
          echo "minify     : ${{ github.event.inputs.minify || 'true (varsayılan)' }}"
          echo "has_keystore (preflight): ${{ needs.preflight.outputs.has_keystore }}"

      - name: "🔒 Gradle wrapper doğrula (depoda varsa)"
        if: ${{ hashFiles('gradle/wrapper/gradle-wrapper.jar') != '' }}
        uses: gradle/actions/wrapper-validation@v5

      - uses: ./.github/actions/setup-android-build

      - name: "🏷️ Sürüm numaralarını güncelle"
        shell: bash
        run: .github/scripts/apply-version.sh

      - name: "🔐 Anahtar deposunu çöz ve doğrula"
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.KFT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.KFT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.KFT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KFT_KEY_PASSWORD }}
          SIGNING_STRICT: "true"
        run: .github/scripts/prepare-signing.sh

      - name: "📦 Release APK derle (R8)"
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.KFT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.KFT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KFT_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease -Pkft.minify=${{ github.event.inputs.minify || 'true' }} \
            --no-daemon --stacktrace --console=plain 2>&1 | tee release-build.log

      - name: "🔐 APK imzasını doğrula ve adlandır"
        id: verify
        shell: bash
        env:
          EXPECT_OWN_KEY: "true"
        run: .github/scripts/verify-release-apk.sh

      - name: "📤 Release APK'yı yükle"
        uses: actions/upload-artifact@v6
        with:
          name: FinansTakip-v${{ needs.version.outputs.version_name }}-release-apk
          path: ${{ steps.verify.outputs.APK_PATH }}
          retention-days: 90
          if-no-files-found: error

      - name: "📤 R8 eşleme dosyası (çökme kayıtlarını çözmek için saklayın)"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mapping-v${{ needs.version.outputs.version_name }}
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
          if-no-files-found: ignore

      - name: "🩺 Release hata özeti"
        if: failure()
        shell: bash
        run: |
          {
            echo "## ❌ Release hatası"
            echo '```'
            grep -nE "^e: |error:|FAILURE:|What went wrong|Caused by|Could not|Unresolved|Execution failed|> Task .* FAILED|GradleException|Release imzası yok|Missing class" \
              release-build.log 2>/dev/null | head -80 || true
            echo '```'
            if [ -f app/build/outputs/mapping/release/missing_rules.txt ]; then
              echo "R8 eksik kurallar:"
              echo '```'
              head -40 app/build/outputs/mapping/release/missing_rules.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "📤 Release günlükleri"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-diagnostics
          path: |
            release-build.log
            imza.txt
          retention-days: 14
          if-no-files-found: ignore

      - name: "🚀 GitHub Release (yalnızca v* etiketi)"
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.verify.outputs.APK_PATH }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$APK_PATH" --clobber
          else
            gh release create "$tag" "$APK_PATH" --title "FinansTakip v$VERSION_NAME" --generate-notes
          fi

      - name: "📝 Release özeti"
        if: always()
        shell: bash
        run: |
          {
            echo "## Release özeti"
            echo "- **Sürüm:** $VERSION_NAME (versionCode $VERSION_CODE)"
            echo "- **R8 küçültme:** ${{ github.event.inputs.minify || 'true' }}"
            echo "- **APK:** ${{ steps.verify.outputs.APK_NAME || '(üretilemedi)' }}"
            echo "- **GitHub Release:** ${{ startsWith(github.ref, 'refs/tags/v') && 'oluşturuldu/güncellendi' || 'atlandı (etiket değil)' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================
  # 5) SUMMARY: tek bakışta genel durum
  # ============================================================
  summary:
    if: ${{ always() }}
    needs: [preflight, version, build, quality, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: "📋 Genel durum"
        shell: bash
        run: |
          show() { case "$1" in success) echo "✅ başarılı";; failure) echo "❌ BAŞARISIZ";; skipped) echo "⏭️ atlandı";; cancelled) echo "🚫 iptal";; *) echo "$1";; esac; }
          {
            echo "## Genel durum"
            echo ""
            echo "| İş | Sonuç |"
            echo "|---|---|"
            echo "| preflight | $(show '${{ needs.preflight.result }}') |"
            echo "| version | $(show '${{ needs.version.result }}') |"
            echo "| build (testler + debug APK) | $(show '${{ needs.build.result }}') |"
            echo "| quality (lint, bilgi) | $(show '${{ needs.quality.result }}') |"
            echo "| release (imzalı APK) | $(show '${{ needs.release.result }}') |"
          } >> "$GITHUB_STEP_SUMMARY"
          for r in '${{ needs.preflight.result }}' '${{ needs.version.result }}' '${{ needs.build.result }}' '${{ needs.release.result }}'; do
            if [ "$r" = "failure" ]; then
              echo "::error::Bir veya daha fazla iş başarısız: ayrıntılar ilgili işin özetinde."
              exit 1
            fi
          done