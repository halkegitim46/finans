name: Android CI + Release

# Push (main/master, v* tag), PR ve manuel tetikleme.
# PR → testler + debug APK + R8 imzasız doğrulama
# Push/Manuel → testler + debug APK + imzalı release APK (R8)
# Tag → ek olarak GitHub Release
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "İmzalı release APK da üretilsin mi?"
        type: boolean
        default: true
      minify:
        description: "R8 küçültme (release çöküyorsa false deneyin)"
        type: choice
        default: "true"
        options:
          - "true"
          - "false"
      version_name:
        description: "Sürüm adı (boşsa 1.0.<çalıştırma no>)"
        type: string
        required: false
        default: ""

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ── Sürüm hesaplama ──────────────────────────────────────────────
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      version_name: ${{ steps.ver.outputs.name }}
      version_code: ${{ steps.ver.outputs.code }}
    steps:
      - id: ver
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            NAME="$INPUT_VERSION"
          else
            NAME="1.0.${{ github.run_number }}"
          fi
          NAME="$(printf '%s' "$NAME" | tr -c 'A-Za-z0-9._-' '_')"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "### Sürüm: \`$NAME\` (code \`${{ github.run_number }}\`)" >> "$GITHUB_STEP_SUMMARY"

  # ── Debug + Testler (her zaman çalışır) ─────────────────────────
  build:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION_NAME: ${{ needs.version.outputs.version_name }}
      VERSION_CODE: ${{ needs.version.outputs.version_code }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Android SDK lisanslarını kabul et
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Gradle wrapper hazırla
        run: |
          if [ ! -f gradlew ]; then gradle wrapper --gradle-version 8.9; fi
          chmod +x gradlew

      - name: Sürüm numaralarını güncelle
        run: |
          sed -i "s/^\(\s*\)versionCode = .*/\1versionCode = ${VERSION_CODE}/" app/build.gradle.kts
          sed -i "s/^\(\s*\)versionName = .*/\1versionName = \"${VERSION_NAME}\"/" app/build.gradle.kts
          grep -E "versionCode|versionName" app/build.gradle.kts
          if ! grep -q "versionCode = ${VERSION_CODE}" app/build.gradle.kts; then
            echo "HATA: versionCode güncellenemedi!"; exit 1
          fi
          if ! grep -q "versionName = \"${VERSION_NAME}\"" app/build.gradle.kts; then
            echo "HATA: versionName güncellenemedi!"; exit 1
          fi

      - name: Birim testleri
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace --console=plain

      - name: Debug APK derle
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee debug-build.log

      - name: Debug APK'yı sürümlü ada kopyala
        shell: bash
        run: |
          mkdir -p out
          SRC=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          cp "$SRC" "out/FinansTakip_V${VERSION_NAME}-debug.apk"
          ls -lh out/

      - name: Hata özeti (başarısızsa)
        if: failure()
        shell: bash
        run: |
          {
            echo '### Derleme hatası'
            echo '```'
            grep -nE "^e: |error:|FAILURE:|What went wrong|Caused by|Could not|Unresolved|Execution failed" debug-build.log | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Derleme logunu yükle
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: debug-build-log
          path: debug-build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: FinansTakip-v${{ needs.version.outputs.version_name }}-debug-apk
          path: out/*.apk
          if-no-files-found: error

  # ── PR'da R8 doğrulaması (imzasız, gizli değişken gerekmez) ────
  r8-rules-check:
    if: github.event_name == 'pull_request'
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION_NAME: ${{ needs.version.outputs.version_name }}
      VERSION_CODE: ${{ needs.version.outputs.version_code }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: |
          if [ ! -f gradlew ]; then gradle wrapper --gradle-version 8.9; fi
          chmod +x gradlew
      - name: Release (R8) derle — imzasız doğrulama
        run: ./gradlew assembleRelease -Pkft.minify=${{ github.event.inputs.minify || 'true' }} --no-daemon --stacktrace --console=plain

  # ── İmzalı Release APK ──────────────────────────────────────────
  release:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true') ||
      github.event_name == 'push'
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      VERSION_NAME: ${{ needs.version.outputs.version_name }}
      VERSION_CODE: ${{ needs.version.outputs.version_code }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Android SDK lisanslarını kabul et
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Gradle wrapper hazırla
        run: |
          if [ ! -f gradlew ]; then gradle wrapper --gradle-version 8.9; fi
          chmod +x gradlew

      - name: Sürüm numaralarını güncelle
        run: |
          sed -i "s/^\(\s*\)versionCode = .*/\1versionCode = ${VERSION_CODE}/" app/build.gradle.kts
          sed -i "s/^\(\s*\)versionName = .*/\1versionName = \"${VERSION_NAME}\"/" app/build.gradle.kts
          grep -E "versionCode|versionName" app/build.gradle.kts
          grep -q "versionCode = ${VERSION_CODE}" app/build.gradle.kts
          grep -q "versionName = \"${VERSION_NAME}\"" app/build.gradle.kts

      - name: Keystore'u çöz
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "### ✅ Keystore çözüldü" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::KEYSTORE_BASE64 tanımlı değil; release APK debug anahtarıyla imzalanacak."
            echo "### ⚠️ Keystore tanımlı değil" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Release APK derle (R8)
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleRelease -Pkft.minify=${{ github.event.inputs.minify || 'true' }} --no-daemon --stacktrace --console=plain 2>&1 | tee release-build.log

      - name: APK imzasını doğrula
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          shopt -s nullglob
          APKS=(app/build/outputs/apk/release/*.apk)
          if [ ${#APKS[@]} -eq 0 ]; then echo "::error::Release APK bulunamadı"; exit 1; fi
          : > imza.txt
          for f in "${APKS[@]}"; do
            "$APKSIGNER" verify --print-certs "$f" | tee -a imza.txt | head -5
          done
          if grep -qi "Android Debug" imza.txt; then
            if [ -n "$KEYSTORE_BASE64" ]; then
              echo "::error::Anahtar tanımlı ama APK debug anahtarıyla imzalanmış. app/build.gradle.kts signingConfigs bloğunu kontrol edin."
              exit 1
            else
              echo "::warning::Release APK debug anahtarıyla imzalandı."
              echo "### ⚠️ Release APK DEBUG anahtarıyla imzalı" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "### ✅ RELEASE APK (kendi anahtarınızla imzalı)" >> "$GITHUB_STEP_SUMMARY"
          fi
          grep -E "Signer #1 certificate (DN|SHA-256)" imza.txt | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

      - name: APK'yı sürümlü ada kopyala
        shell: bash
        run: |
          mkdir -p out
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$SRC" "out/FinansTakip_V${VERSION_NAME}.apk"
          ls -lh out/

      - name: Release logunu yükle
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-build-log
          path: release-build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v6
        with:
          name: FinansTakip-v${{ needs.version.outputs.version_name }}-release-apk
          path: out/FinansTakip_V*.apk
          if-no-files-found: error

      - name: R8 eşleme dosyasını yükle
        uses: actions/upload-artifact@v6
        with:
          name: mapping-v${{ needs.version.outputs.version_name }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

      - name: GitHub Release'e ekle (yalnızca tag'de)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: FinansTakip v${{ needs.version.outputs.version_name }}
          files: out/FinansTakip_V*.apk

      - name: Release özeti
        if: always()
        shell: bash
        run: |
          {
            echo "## Release özeti"
            echo "- **VERSION_NAME:** $VERSION_NAME"
            echo "- **VERSION_CODE:** $VERSION_CODE"
            echo "- **İmzalı APK:** FinansTakip_V${VERSION_NAME}.apk"
            echo "- **GitHub Release:** ${{ startsWith(github.ref, 'refs/tags/') && 'oluşturuldu' || 'atlandı (tag değil)' }}"
          } >> "$GITHUB_STEP_SUMMARY"