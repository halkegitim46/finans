name: APK Derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Gradle wrapper hazırla
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: İmza anahtarını hazırla
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Sabit imza anahtarı kullanılacak."
          else
            echo "::warning::KEYSTORE_BASE64 secret tanımlı değil. APK rastgele debug anahtarıyla imzalanacak."
          fi

      - name: Sürüm numaralarını güncelle
        run: |
          VERSION_CODE=${{ github.run_number }}
          VERSION_NAME="1.0.${{ github.run_number }}"

          sed -i "s/^\(\s*\)versionCode = .*/\1versionCode = ${VERSION_CODE}/" app/build.gradle.kts
          sed -i "s/^\(\s*\)versionName = .*/\1versionName = \"${VERSION_NAME}\"/" app/build.gradle.kts

          grep -E "versionCode|versionName" app/build.gradle.kts

          if ! grep -q "versionCode = ${VERSION_CODE}" app/build.gradle.kts; then
            echo "HATA: versionCode güncellenemedi!"
            exit 1
          fi
          if ! grep -q "versionName = \"${VERSION_NAME}\"" app/build.gradle.kts; then
            echo "HATA: versionName güncellenemedi!"
            exit 1
          fi

      - name: Debug APK derle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK'yı yeniden adlandır
        id: rename_apk
        run: |
          OLD_PATH="app/build/outputs/apk/debug/app-debug.apk"
          NEW_NAME="FinansTakip_V${{ github.run_number }}.apk"
          NEW_PATH="app/build/outputs/apk/debug/${NEW_NAME}"

          if [ ! -f "$OLD_PATH" ]; then
            echo "HATA: Derleme çıktısı bulunamadı: $OLD_PATH"
            exit 1
          fi

          mv "$OLD_PATH" "$NEW_PATH"
          echo "NEW_APK_PATH=$NEW_PATH" >> "$GITHUB_OUTPUT"
          echo "NEW_APK_NAME=$NEW_NAME" >> "$GITHUB_OUTPUT"

      - name: İmza parmak izini yazdır
        continue-on-error: true
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$APKSIGNER" verify --print-certs "${{ steps.rename_apk.outputs.NEW_APK_PATH }}" | grep -E "Signer #1 certificate (DN|SHA-256)" || true

      - name: APK'yı yükle
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.rename_apk.outputs.NEW_APK_NAME }}
          path: ${{ steps.rename_apk.outputs.NEW_APK_PATH }}
          if-no-files-found: error

      - name: Birim testleri
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Başarısız testleri özetle
        if: failure()
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          files = sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml"))
          if not files:
              print("Test sonuç dosyası yok: büyük olasılıkla test kodu derlenemedi.")
          failed = 0
          for f in files:
              for case in ET.parse(f).getroot().iter("testcase"):
                  for tag in ("failure", "error"):
                      for e in case.findall(tag):
                          failed += 1
                          print("BASARISIZ:", case.get("classname") + "." + case.get("name"))
                          print("   ", (e.get("message") or "")[:400].replace("\n", " "))
          print("Toplam başarısız test:", failed)
          PY

      - name: Test raporunu yükle
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-raporu
          path: app/build/reports/tests/
          if-no-files-found: ignore