name: Android CI + Release (tek dosya, teşhisli)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "İmzalı release APK da üretilsin mi?"
        type: boolean
        default: true
      minify:
        description: "R8 küçültme (release çöküyorsa false deneyin)"
        type: choice
        default: "true"
        options:
          - "true"
          - "false"
      version_name:
        description: "Sürüm adı (boşsa 1.0.<çalıştırma no>)"
        type: string
        required: false
        default: ""

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# ============================================================
# 0) PREFLIGHT — Derlemeden ÖNCE ortamı denetler.
#    Burada kırmızı olan bir şey varsa, derleme zaten patlayacaktır;
#    en azından nedenini erkenden görürsünüz.
# ============================================================
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      has_keystore: ${{ steps.secrets.outputs.has_keystore }}
    steps:
      - uses: actions/checkout@v5

      - name: "🔎 [preflight] Secret varlığını raporla (değer gösterme)"
        id: secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.KFT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.KFT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.KFT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KFT_KEY_PASSWORD }}
        run: |
          echo "::group::Secret durumu (yalnızca VAR/YOK, değer yok)"
          has_ks="false"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "  [VAR] KEYSTORE_BASE64 (uzunluk: ${#KEYSTORE_BASE64})"
            has_ks="true"
          else
            echo "  [YOK] KEYSTORE_BASE64  -> release APK üretilemez"
          fi
          if [ -n "${KEYSTORE_PASSWORD:-}" ]; then echo "  [VAR] KEYSTORE_PASSWORD (uzunluk: ${#KEYSTORE_PASSWORD})"; else echo "  [YOK] KEYSTORE_PASSWORD"; has_ks="false"; fi
          if [ -n "${KEY_ALIAS:-}" ];        then echo "  [VAR] KEY_ALIAS = ${KEY_ALIAS}";                     else echo "  [YOK] KEY_ALIAS";        has_ks="false"; fi
          if [ -n "${KEY_PASSWORD:-}" ];     then echo "  [VAR] KEY_PASSWORD (uzunluk: ${#KEY_PASSWORD})";     else echo "  [YOK] KEY_PASSWORD";     has_ks="false"; fi
          echo "has_keystore=${has_ks}" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

          {
            echo "## 🧪 Preflight — secret durumu"
            echo ""
            echo "| Secret | Durum |"
            echo "|---|---|"
            echo "| KEYSTORE_BASE64 | $([ -n "${KEYSTORE_BASE64:-}" ] && echo '✅ VAR' || echo '❌ YOK') |"
            echo "| KEYSTORE_PASSWORD | $([ -n "${KEYSTORE_PASSWORD:-}" ] && echo '✅ VAR' || echo '❌ YOK') |"
            echo "| KEY_ALIAS | ${KEY_ALIAS:+✅ VAR (${KEY_ALIAS})}${KEY_ALIAS:-❌ YOK} |"
            echo "| KEY_PASSWORD | $([ -n "${KEY_PASSWORD:-}" ] && echo '✅ VAR' || echo '❌ YOK') |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "🔎 [preflight] Proje dosyalarını denetle"
        shell: bash
        run: |
          echo "::group::Dosya kontrolleri"
          for f in app/build.gradle.kts proguard-rules.pro gradle/wrapper/gradle-wrapper.properties; do
            if [ -f "$f" ]; then echo "  [VAR]   $f"; else echo "  [YOK]   $f"; fi
          done
          if [ -f gradlew ]; then
            echo "  [VAR]   gradlew"
          else
            echo "  [YOK]   gradlew — workflow üretecek (sorun değil)"
          fi
          echo "::endgroup::"

      - name: "🔎 [preflight] build.gradle.kts sed uyumu"
        shell: bash
        run: |
          echo "::group::versionCode / versionName satırları (sed bunları hedefliyor)"
          if grep -nE '^\s*versionCode\s*=\s*[0-9]+' app/build.gradle.kts; then
            echo "  ✅ versionCode satırı sed ile uyumlu"
          else
            echo "  ❌ versionCode satırı bulunamadı/eşleşmiyor — sed aşaması patlar"
          fi
          if grep -nE '^\s*versionName\s*=\s*".*"' app/build.gradle.kts; then
            echo "  ✅ versionName satırı sed ile uyumlu"
          else
            echo "  ❌ versionName satırı bulunamadı/eşleşmiyor — sed aşaması patlar"
          fi
          echo "::endgroup::"

      - name: "🔎 [preflight] İmza bloğu ve koruma kontrolü"
        shell: bash
        run: |
          echo "::group::build.gradle.kts imza izleri"
          grep -nE 'signingConfigs|create\("shared"\)|signingConfig\s*=\s*signingConfigs' app/build.gradle.kts \
            || echo "  ⚠️ signingConfigs / signingConfig satırı bulunamadı — release imzasız kalabilir"
          if grep -q 'KEYSTORE_PATH' app/build.gradle.kts; then
            echo "  ✅ KEYSTORE_PATH build.gradle.kts'de okunuyor"
          else
            echo "  ❌ KEYSTORE_PATH build.gradle.kts'de geçmiyor — imza config eksik olabilir"
          fi
          if grep -q 'taskGraph.whenReady' app/build.gradle.kts; then
            echo "  ℹ️ taskGraph.whenReady koruması VAR (release imzasızsa Gradle hata verir)"
          else
            echo "  ℹ️ taskGraph.whenReady koruması YOK"
          fi
          echo "::endgroup::"

# ============================================================
# 1) VERSION — sürüm numarası hesapla
# ============================================================
  version:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      version_name: ${{ steps.ver.outputs.name }}
      version_code: ${{ steps.ver.outputs.code }}
    steps:
      - id: ver
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            NAME="$INPUT_VERSION"
          else
            NAME="1.0.${{ github.run_number }}"
          fi
          # Dosya adına güvenli karakterler
          NAME="$(printf '%s' "$NAME" | tr -c 'A-Za-z0-9._-' '_')"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "### Sürüm: \`$NAME\` (code \`${{ github.run_number }}\`)" >> "$GITHUB_STEP_SUMMARY"

# ============================================================
# 2) BUILD — testler + debug APK
# ============================================================
  build:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION_NAME: ${{ needs.version.outputs.version_name }}
      VERSION_CODE: ${{ needs.version.outputs.version_code }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: "🧰 [build] Android SDK lisansları"
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: "🧰 [build] Gradle wrapper hazırla"
        run: |
          if [ ! -f gradlew ]; then gradle wrapper --gradle-version 8.9; fi
          chmod +x gradlew
          ./gradlew --version

      - name: "🧰 [build] Sürüm numaralarını güncelle"
        id: bump
        shell: bash
        run: |
          cp app/build.gradle.kts app/build.gradle.kts.orig
          echo "::group::sed öncesi"
          grep -nE 'versionCode|versionName' app/build.gradle.kts
          echo "::endgroup::"
          sed -i "s/^\(\s*\)versionCode = .*/\1versionCode = ${VERSION_CODE}/" app/build.gradle.kts
          sed -i "s/^\(\s*\)versionName = .*/\1versionName = \"${VERSION_NAME}\"/" app/build.gradle.kts
          echo "::group::sed sonrası"
          grep -nE 'versionCode|versionName' app/build.gradle.kts
          echo "::endgroup::"
          if ! grep -q "versionCode = ${VERSION_CODE}" app/build.gradle.kts; then
            echo "::error::versionCode sed ile güncellenemedi. app/build.gradle.kts'de satır formatı uyumsuz."
            exit 1
          fi
          if ! grep -q "versionName = \"${VERSION_NAME}\"" app/build.gradle.kts; then
            echo "::error::versionName sed ile güncellenemedi."
            exit 1
          fi
          diff -u app/build.gradle.kts.orig app/build.gradle.kts || true

      # NOT: Testler artık AYRI adım. Kırmızı olsa bile debug APK üretilir,
      # sadece "test kırmızı" olarak görünür ve release job'ı BLOKE OLMAZ.
      - name: "🧪 [build] Birim testleri"
        id: tests
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon --stacktrace --console=plain 2>&1 | tee unit-tests.log
          rc=$?
          echo "test_rc=$rc" >> "$GITHUB_OUTPUT"
          # başarısız testleri özetle (Summary'ye)
          if [ -d app/build/test-results/testDebugUnitTest ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY" || true
          import glob, xml.etree.ElementTree as ET
          files = sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml"))
          failed = 0
          lines = []
          for f in files:
              for case in ET.parse(f).getroot().iter("testcase"):
                  for tag in ("failure", "error"):
                      for e in case.findall(tag):
                          failed += 1
                          lines.append(f"- `{case.get('classname')}.{case.get('name')}`: {(e.get('message') or '')[:200]}")
          if not files:
              print("### 🧪 Birim testleri\n\nTest sonuç dosyası yok (test kodu derlenemedi olabilir).\n")
          else:
              print(f"### 🧪 Birim testleri — başarısız: {failed}\n")
              print("\n".join(lines) if lines else "Tüm testler geçti.")
          PY
          fi
          exit $rc

      - name: "📦 [build] Debug APK derle"
        id: assemble_debug
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee debug-build.log

      - name: "📦 [build] Debug APK'yı kopyala"
        shell: bash
        run: |
          mkdir -p out
          SRC=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1 || true)
          if [ -z "$SRC" ]; then
            echo "::error::Debug APK üretilmedi! app/build/outputs/apk/debug/ boş."
            ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "(klasör yok)"
            exit 1
          fi
          cp "$SRC" "out/FinansTakip_V${VERSION_NAME}-debug.apk"
          ls -lh out/

      - name: "🩺 [build] Hata özeti (derleme başarısızsa)"
        if: failure()
        shell: bash
        run: |
          {
            echo "## ❌ Build hatası"
            echo '```'
            grep -nE "^e: |error:|FAILURE:|What went wrong|Caused by|Could not|Unresolved|Execution failed|> Task .* FAILED" \
              unit-tests.log debug-build.log 2>/dev/null | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "📤 [build] Log ve diff artifact'ları"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-diagnostics
          path: |
            unit-tests.log
            debug-build.log
            app/build.gradle.kts.orig
            app/build.gradle.kts
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: FinansTakip-v${{ needs.version.outputs.version_name }}-debug-apk
          path: out/*.apk
          if-no-files-found: error

# ============================================================
# 3) RELEASE — imzalı APK (yalnızca workflow_dispatch+release=true veya tag)
#    Debug build job'ına BAĞIMLI DEĞİL; böylece testler kırmızı olsa bile
#    release üretilebilir. Sadece version job'ına bağlıdır.
# ============================================================
  release:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true') ||
      startsWith(github.ref, 'refs/tags/v')
    needs: [preflight, version]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      VERSION_NAME: ${{ needs.version.outputs.version_name }}
      VERSION_CODE: ${{ needs.version.outputs.version_code }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.KFT_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.KFT_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KFT_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: "🧰 [release] Android SDK lisansları"
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: "🧰 [release] Gradle wrapper hazırla"
        run: |
          if [ ! -f gradlew ]; then gradle wrapper --gradle-version 8.9; fi
          chmod +x gradlew
          ./gradlew --version

      - name: "🧰 [release] Sürüm numaralarını güncelle"
        shell: bash
        run: |
          sed -i "s/^\(\s*\)versionCode = .*/\1versionCode = ${VERSION_CODE}/" app/build.gradle.kts
          sed -i "s/^\(\s*\)versionName = .*/\1versionName = \"${VERSION_NAME}\"/" app/build.gradle.kts
          grep -nE 'versionCode|versionName' app/build.gradle.kts
          if ! grep -q "versionCode = ${VERSION_CODE}" app/build.gradle.kts; then
            echo "::error::versionCode sed ile güncellenemedi"; exit 1
          fi
          if ! grep -q "versionName = \"${VERSION_NAME}\"" app/build.gradle.kts; then
            echo "::error::versionName sed ile güncellenemedi"; exit 1
          fi

      # prepare-signing.sh GÖMÜLÜ: tek dosya, harici .sh bağımlılığı yok.
      # Görevleri:
      #   1) KEYSTORE_BASE64 (varsa eski KFT_ öneki) çözüp $RUNNER_TEMP/release.jks'e yaz
      #   2) KEYSTORE_PATH / _PASSWORD / KEY_ALIAS / KEY_PASSWORD'i $GITHUB_ENV'ye aktar
      #   3) keytool -list ile keystore'un gerçekten açılabildiğini doğrula
      #   4) Herhangi bir adım eksik/bozuksa ANLAŞILIR hata ile dur
      - name: "🔐 [release] Keystore'u çöz ve doğrula (gömülü hazırlık)"
        id: keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.KFT_KEYSTORE_BASE64 }}
        run: |
          echo "::group::1) Base64 -> JKS çözme"
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 secret'ı tanımlı değil. Release APK üretilemez. (generate-keystore.yml ile üretip Settings → Secrets'a ekleyin.)"
            exit 1
          fi
          # Boşluk / satır sonu / \r hepsini temizle (aksi halde decode bozulur)
          CLEAN_B64=$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')
          if ! printf '%s' "$CLEAN_B64" | base64 --decode > "$RUNNER_TEMP/release.jks" 2>/dev/null; then
            echo "::error::KEYSTORE_BASE64 base64 olarak çözülemedi. Tek satır, boşluksuz olmalı (base64 -w0 kft.jks)."
            exit 1
          fi
          size=$(stat -c%s "$RUNNER_TEMP/release.jks")
          echo "Çözülen keystore: $RUNNER_TEMP/release.jks ($size bayt)"
          if [ "$size" -lt 100 ]; then
            echo "::error::Çözülen keystore çok küçük ($size bayt). Base64 değeri bozuk olabilir."
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::2) Ortam değişkenlerini sonraki adımlara aktar"
          {
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "KEYSTORE_PATH, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD -> \$GITHUB_ENV"
          echo "::endgroup::"

          echo "::group::3) keytool ile doğrula (alias gerçekten var mı?)"
          for v in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v:-}" ]; then
              echo "::error::$v boş! Settings → Secrets'ta tanımlı olmalı."
              exit 1
            fi
          done
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" \
                -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::Keystore açılamadı veya '$KEY_ALIAS' alias'ı yok. KEYSTORE_PASSWORD veya KEY_ALIAS hatalı."
            exit 1
          fi
          echo "✅ Keystore ve '$KEY_ALIAS' alias'ı doğrulandı."
          echo "::endgroup::"

      - name: "🔎 [release] Ortam ön kontrolü"
        shell: bash
        run: |
          echo "KEYSTORE_PATH    : $([ -n "${KEYSTORE_PATH:-}" ] && echo "VAR ($KEYSTORE_PATH)" || echo YOK)"
          echo "KEYSTORE_PASSWORD: $([ -n "${KEYSTORE_PASSWORD:-}" ] && echo VAR || echo YOK)"
          echo "KEY_ALIAS        : ${KEY_ALIAS:-YOK}"
          echo "KEY_PASSWORD     : $([ -n "${KEY_PASSWORD:-}" ] && echo VAR || echo YOK)"
          if [ -z "${KEYSTORE_PATH:-}" ] || [ ! -f "${KEYSTORE_PATH:-}" ]; then
            echo "::error::KEYSTORE_PATH tanımlı değil veya dosya yok — assembleRelease GradleException atacak."
            exit 1
          fi

      - name: "📦 [release] Release APK derle (R8)"
        id: assemble_release
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleRelease -Pkft.minify=${{ github.event.inputs.minify || 'true' }} \
            --no-daemon --stacktrace --console=plain 2>&1 | tee release-build.log

      - name: "🩺 [release] Derleme hatası özeti"
        if: failure()
        shell: bash
        run: |
          {
            echo "## ❌ Release derleme hatası"
            echo '```'
            grep -nE "^e: |error:|FAILURE:|What went wrong|Caused by|Could not|Unresolved|Execution failed|> Task .* FAILED|GradleException|Release imzası yok" \
              release-build.log 2>/dev/null | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "🔐 [release] APK imzasını doğrula"
        id: verify
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.KFT_KEYSTORE_BASE64 }}
        run: |
          set +o pipefail
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" version || true
          shopt -s nullglob
          APKS=(app/build/outputs/apk/release/*.apk)
          if [ ${#APKS[@]} -eq 0 ]; then
            echo "::error::Release APK bulunamadı (app/build/outputs/apk/release/ boş)"
            ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "(klasör yok)"
            exit 1
          fi
          : > imza.txt
          VERIFY_FAILED=0
          for f in "${APKS[@]}"; do
            echo "=== Dosya: $f ==="
            set +e
            OUTPUT=$("$APKSIGNER" verify --verbose --print-certs "$f" 2>&1)
            RC=$?
            set -e
            printf '%s\n' "$OUTPUT" | tee -a imza.txt
            echo "--- verify rc: $RC ---"
            if [ $RC -ne 0 ]; then
              VERIFY_FAILED=1
              echo "::error::apksigner doğrulaması başarısız: $f (kod $RC)"
              keytool -printcert -jarfile "$f" 2>&1 || echo "(keytool da başarısız)"
            fi
          done
          if [ $VERIFY_FAILED -ne 0 ]; then exit 1; fi
          if grep -qi "Android Debug" imza.txt; then
            if [ -n "$KEYSTORE_BASE64" ]; then
              echo "::error::APK debug anahtarıyla imzalanmış ama KEYSTORE_BASE64 tanımlı. build.gradle.kts signingConfigs bloğunu kontrol edin."
              exit 1
            else
              echo "::warning::Release APK debug anahtarıyla imzalandı."
            fi
          else
            echo "### ✅ RELEASE APK kendi anahtarınızla imzalı" >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            grep -E "certificate DN:" imza.txt | sed -E 's/^[[:space:]]*//; s/^/- DN: /' || true
            grep -E "certificate SHA-256 digest:" imza.txt | sed -E 's/^[[:space:]]*//; s/^/- SHA-256: /' || true
          } >> "$GITHUB_STEP_SUMMARY"
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          NEW="app/build/outputs/apk/release/FinansTakip_V${VERSION_NAME}.apk"
          mv "$SRC" "$NEW"
          echo "APK_PATH=$NEW" >> "$GITHUB_OUTPUT"
          echo "APK_NAME=FinansTakip_V${VERSION_NAME}.apk" >> "$GITHUB_OUTPUT"

      - name: "📤 [release] APK'yı yükle"
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: FinansTakip-v${{ needs.version.outputs.version_name }}-release-apk
          path: ${{ steps.verify.outputs.APK_PATH }}
          if-no-files-found: error

      - name: "📤 [release] Log ve imza artifact'ları"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-diagnostics
          path: |
            release-build.log
            imza.txt
            app/build.gradle.kts
          if-no-files-found: ignore

      - name: "📤 [release] R8 eşleme dosyası"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mapping-v${{ needs.version.outputs.version_name }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

      - name: "🚀 [release] GitHub Release'e ekle (yalnızca tag)"
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: FinansTakip v${{ needs.version.outputs.version_name }}
          files: ${{ steps.verify.outputs.APK_PATH }}

      - name: "📝 [release] Özet"
        if: always()
        shell: bash
        run: |
          {
            echo "## Release özeti"
            echo "- **VERSION_NAME:** $VERSION_NAME"
            echo "- **VERSION_CODE:** $VERSION_CODE"
            echo "- **Minify:** ${{ github.event.inputs.minify || 'true' }}"
            echo "- **APK:** ${{ steps.verify.outputs.APK_NAME || '(üretilemedi)' }}"
            echo "- **GitHub Release:** ${{ startsWith(github.ref, 'refs/tags/') && 'oluşturuldu' || 'atlandı (tag değil)' }}"
          } >> "$GITHUB_STEP_SUMMARY"