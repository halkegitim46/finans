name: İmza anahtarı üret (tek seferlik)

# ÖNEMLİ: Yalnızca ÖZEL (private) depoda çalışır. Üretilen anahtar artifact olarak iner;
# indirip secret'lara ekledikten sonra artifact'ı VE bu workflow dosyasını silin.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Yalnızca özel depoda çalış
        if: ${{ github.event.repository.private != true }}
        run: |
          echo "::error::Bu depo herkese açık. Anahtar sızabileceği için çalıştırılmadı. Depoyu özel yapın veya anahtarı bilgisayarda üretin."
          exit 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Anahtar üret
        run: |
          PASS=$(openssl rand -base64 36 | tr -dc 'A-Za-z0-9' | head -c 24)
          echo "::add-mask::$PASS"
          keytool -genkeypair -v -keystore kft.jks -storetype PKCS12 -alias kft \
            -keyalg RSA -keysize 4096 -validity 36500 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Kisisel Finans Takip, O=Kisisel, C=TR" > /dev/null
          base64 -w0 kft.jks > kft.jks.b64
          {
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_ALIAS=kft"
            echo "KEY_PASSWORD=$PASS"
            echo "KEYSTORE_BASE64 = kft.jks.b64 dosyasının tüm içeriği"
          } > secretler.txt

      - uses: actions/upload-artifact@v6
        with:
          name: kft-anahtar
          path: |
            kft.jks
            kft.jks.b64
            secretler.txt
          retention-days: 1
          if-no-files-found: error
