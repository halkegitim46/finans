name: Proje dosyalarını tamamla (Gradle wrapper + Room şemaları)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Gradle wrapper üret
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew

      - name: Derle (Room şemalarını dışa aktarır)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Depoya işle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper app/schemas
          if git diff --cached --quiet; then
            echo "Eklenecek değişiklik yok."
          else
            git commit -m "chore: Gradle wrapper ve Room şemaları eklendi"
            git push
          fi