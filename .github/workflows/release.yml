name: Release APK (imzalı)

# Elle çalıştırılır: Actions → "Release APK (imzalı)" → Run workflow.
# Yalnızca * secret'ları tanımlıysa çalışır; asla rastgele debug anahtarıyla imzalamaz.
on:
  workflow_dispatch:
    inputs:
      minify:
        description: "R8 küçültme (release APK açılışta çöküyorsa false deneyin)"
        type: choice
        default: "true"
        options:
          - "true"
          - "false"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Gradle wrapper hazırla
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: İmza anahtarını zorunlu kıl
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Release için KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS ve KEY_PASSWORD secret'ları tanımlı olmalı (bkz. README)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kft.jks"
          {
            echo "KEYSTORE_PATH=$RUNNER_TEMP/kft.jks"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Sürüm numaralarını güncelle
        run: |
          VERSION_CODE=${{ github.run_number }}
          VERSION_NAME="1.0.${{ github.run_number }}"
          sed -i "s/^\(\s*\)versionCode = .*/\1versionCode = ${VERSION_CODE}/" app/build.gradle.kts
          sed -i "s/^\(\s*\)versionName = .*/\1versionName = \"${VERSION_NAME}\"/" app/build.gradle.kts
          grep -E "versionCode|versionName" app/build.gradle.kts
          grep -q "versionCode = ${VERSION_CODE}" app/build.gradle.kts
          grep -q "versionName = \"${VERSION_NAME}\"" app/build.gradle.kts

      # Release, testler geçmeden üretilmez.
      - name: Birim testleri
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Release APK derle
        run: ./gradlew assembleRelease -Pkft.minify=${{ inputs.minify }} --no-daemon --stacktrace

      - name: İmzayı doğrula
        id: verify
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::İmzalı release APK bulunamadı ($APK)."
            exit 1
          fi
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$APKSIGNER" verify --print-certs "$APK" | tee cert.txt
          NEW="app/build/outputs/apk/release/FinansTakip_V${{ github.run_number }}_release.apk"
          mv "$APK" "$NEW"
          echo "APK_PATH=$NEW" >> "$GITHUB_OUTPUT"
          echo "APK_NAME=FinansTakip_V${{ github.run_number }}_release.apk" >> "$GITHUB_OUTPUT"

      - name: Release APK'yı yükle
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.verify.outputs.APK_NAME }}
          path: ${{ steps.verify.outputs.APK_PATH }}
          if-no-files-found: error

      # Çökme kayıtlarını çözmek için gerekli; APK ile birlikte saklayın.
      - name: R8 eşleme dosyasını yükle
        uses: actions/upload-artifact@v6
        with:
          name: mapping-V${{ github.run_number }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

      - name: Test raporunu yükle
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-raporu-release
          path: app/build/reports/tests/
          if-no-files-found: ignore
