name: Release APK (imzalı)

# Elle çalıştırılır: Actions → "Release APK (imzalı)" → Run workflow.
# İmza secret'ları eksik/hatalıysa NEDENİNİ söyleyerek durur; asla rastgele debug anahtarıyla imzalamaz.
on:
  workflow_dispatch:
    inputs:
      minify:
        description: "R8 küçültme (release APK açılışta çöküyorsa false deneyin)"
        type: choice
        default: "true"
        options:
          - "true"
          - "false"
      require_tests:
        description: "Birim testleri geçmeden release üretme (testler kırıksa false seçip yine de üretebilirsiniz)"
        type: choice
        default: "true"
        options:
          - "true"
          - "false"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Gradle wrapper hazırla
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      # Secret adları: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD (eski KFT_ önekli adlar da kabul edilir).
      - name: İmza anahtarını hazırla (zorunlu)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.KFT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.KFT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.KFT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KFT_KEY_PASSWORD }}
          SIGNING_STRICT: "true"
        run: bash .github/scripts/prepare-signing.sh

      - name: Sürüm numaralarını güncelle
        run: |
          # Debug ve release iş akışlarının sayaçları (run_number) AYRIDIR; ortak ve hep artan bir sürüm kodu için zaman damgası
          # (UTC dakika) kullanılır. Böylece hangi iş akışından olursa olsun yeni APK eskisinin üstüne kurulur.
          VERSION_CODE=$(( $(date -u +%s) / 60 ))
          VERSION_NAME="1.0.$(date -u +%y%m%d%H%M)"
          sed -i "s/^\(\s*\)versionCode = .*/\1versionCode = ${VERSION_CODE}/" app/build.gradle.kts
          sed -i "s/^\(\s*\)versionName = .*/\1versionName = \"${VERSION_NAME}\"/" app/build.gradle.kts
          grep -E "versionCode|versionName" app/build.gradle.kts
          grep -q "versionCode = ${VERSION_CODE}" app/build.gradle.kts
          grep -q "versionName = \"${VERSION_NAME}\"" app/build.gradle.kts

      # require_tests=true ise release, testler geçmeden üretilmez.
      - name: Birim testleri
        if: ${{ inputs.require_tests == 'true' }}
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Başarısız testleri özetle
        if: failure()
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          files = sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml"))
          if not files:
              print("Test sonuç dosyası yok (test koşmadı veya test kodu derlenemedi).")
          failed = 0
          for f in files:
              for case in ET.parse(f).getroot().iter("testcase"):
                  for tag in ("failure", "error"):
                      for e in case.findall(tag):
                          failed += 1
                          print("BASARISIZ:", case.get("classname") + "." + case.get("name"))
                          print("   ", (e.get("message") or "")[:400].replace("\n", " "))
          print("Toplam başarısız test:", failed)
          PY

      - name: Release APK derle
        run: ./gradlew assembleRelease -Pkft.minify=${{ inputs.minify }} --no-daemon --stacktrace

      - name: İmzayı doğrula
        id: verify
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::İmzalı release APK bulunamadı ($APK). Klasör içeriği:"
            ls -la app/build/outputs/apk/release 2>/dev/null || echo "(klasör yok)"
            exit 1
          fi
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER="$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)/apksigner"
          echo "apksigner: $APKSIGNER"
          if ! "$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1 | tee cert.txt; then
            echo "::error::apksigner imzayı doğrulayamadı (yukarıdaki çıktıya bakın)."
            exit 1
          fi
          NEW="app/build/outputs/apk/release/FinansTakip_V${{ github.run_number }}_release.apk"
          mv "$APK" "$NEW"
          echo "APK_PATH=$NEW" >> "$GITHUB_OUTPUT"
          echo "APK_NAME=FinansTakip_V${{ github.run_number }}_release.apk" >> "$GITHUB_OUTPUT"

      - name: Release APK'yı yükle
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.verify.outputs.APK_NAME }}
          path: ${{ steps.verify.outputs.APK_PATH }}
          if-no-files-found: error

      # Çökme kayıtlarını çözmek için gerekli; APK ile birlikte saklayın.
      - name: R8 eşleme dosyasını yükle
        uses: actions/upload-artifact@v6
        with:
          name: mapping-V${{ github.run_number }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

      - name: Release hatası teşhisi
        if: failure()
        run: |
          echo "--- R8 eksik kurallar (varsa) ---"
          cat app/build/outputs/mapping/release/missing_rules.txt 2>/dev/null || echo "(yok)"
          echo "--- release çıktı klasörü ---"
          ls -la app/build/outputs/apk/release 2>/dev/null || echo "(yok)"

      - name: Raporları yükle
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-raporlari
          path: |
            app/build/reports/
            app/build/outputs/mapping/release/
          if-no-files-found: ignore
