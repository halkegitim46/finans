# Çekirdek sürüm grubu (Kotlin, KSP, AGP, Hilt, Room) birlikte ve elle yükseltilir (bkz. docs/UYUMLULUK.md): otomatik PR'dan hariç.
# Diğer bağımlılıklar aylık, tek PR'da gelir; CI (preflight uyumluluk + testler) her PR'de çalışır.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      diger-bagimliliklar:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "org.jetbrains.kotlin*"
      - dependency-name: "com.google.devtools.ksp*"
      - dependency-name: "com.android.application"
      - dependency-name: "com.android.tools.build:gradle"
      - dependency-name: "com.google.dagger*"
      - dependency-name: "androidx.room*"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
